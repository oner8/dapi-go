# 1Panel: 容器 -> 编排 -> 创建编排，直接导入本文件。
services:
  dapi-go:
    build:
      context: .
      dockerfile: Dockerfile
    image: dapi-go:local
    container_name: dapi-go
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${DAPI_PORT:-8080}:8080"
    volumes:
      - dapi-go-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  dapi-go-data:
